  test_size: 0.2
  validation_size: 0.1
  random_state: 42
thresholds:
  default: 0.5
  per_tool:
    grep_search: 0.5
    codebase_search: 0.5
    read_file: 0.5
    list_dir: 0.5
    run_terminal_cmd: 0.5
    edit_file: 0.5
    web_search: 0.5
fallback:
  strategy: select_all
  default_tools: []
logging:
  level: INFO
  log_prompt_content: false
experiments:
  output_dir: experiments
  track: true
